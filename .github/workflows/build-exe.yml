name: Build Windows EXE

# Builds the single-file CameraWireTool.exe on a Windows runner.
#  - Runs on every push to main and on manual dispatch  -> uploads the exe
#    as a build artifact you can download from the run page.
#  - On a version tag (vX.Y.Z) -> also attaches the exe to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # needed for the release-upload step on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest -q

      - name: Build EXE
        run: pyinstaller --noconfirm camera_wire_tool.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraWireTool-windows
          path: dist/CameraWireTool.exe
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CameraWireTool.exe
